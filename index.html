<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Lapor Bencana - KKP & LAUTRA</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Custom Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'canvas-cream': '#fbfbf5',
                        'canvas-light': '#ffffff',
                        'aloe-10': '#c1fbd4',
                        'pistachio-10': '#d4f9e0',
                        'ocean-10': '#e0f2fe', /* Biru Muda Terang */
                        'hairline-light': '#e4e4e7'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    boxShadow: {
                        'soft-halo': '0 2px 10px rgba(0, 0, 0, 0.02), 0 10px 25px rgba(0, 0, 0, 0.04)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-feature-settings: "ss03" 1;
            -webkit-font-smoothing: antialiased;
        }
        #toast-container {
            transition: opacity 0.3s ease-in-out;
        }
        input[type="file"]::file-selector-button {
            border: 1px solid #e4e4e7;
            background-color: #f9fafb;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            margin-right: 0.75rem;
        }
        input[type="file"]::file-selector-button:hover {
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="bg-canvas-cream text-gray-900 min-h-screen pb-16">

    <!-- Header menggunakan warna Biru Muda (ocean-10) -->
    <header class="bg-ocean-10 w-full py-6 px-6 sm:px-12 border-b border-hairline-light mb-8">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
            
            <div class="flex flex-col sm:flex-row items-start sm:items-center gap-4">
                <!-- Wrapper Logo KKP & LAUTRA -->
                <div class="flex items-center gap-3 bg-blue-900 px-4 py-2 rounded-2xl shadow-sm border border-blue-800">
                    <!-- Logo KKP di-zoom dengan wrapper overflow-hidden untuk memotong ruang putih berlebih -->
                    <div class="h-12 w-12 sm:h-14 sm:w-14 bg-white rounded-lg overflow-hidden flex items-center justify-center shrink-0">
                        <img src="https://drive.google.com/thumbnail?id=1vSy1-pCfjfPd0_XUJjnu7z2L6cq-eoG_&sz=w400" alt="Logo KKP" class="h-full w-full object-contain scale-[1.5]" onerror="console.error('Gagal memuat logo KKP.')">
                    </div>
                    <div class="w-px h-10 bg-blue-700"></div>
                    <img src="https://drive.google.com/thumbnail?id=13kZGgHlUJ479xn5znwCcA6BgLqjxl0_d&sz=w400" alt="Logo LAUTRA" class="h-10 sm:h-12 w-auto object-contain" onerror="console.error('Gagal memuat logo LAUTRA.')">
                </div>
                
                <div>
                    <h1 class="text-2xl font-bold tracking-tight text-gray-900">Portal Lapor Bencana</h1>
                    <p class="text-sm text-blue-800 mt-1">Pemantauan Infrastruktur & Kerusakan Wilayah</p>
                </div>
            </div>

            <span class="bg-blue-100 text-blue-900 text-xs font-semibold px-4 py-2 rounded-full border border-blue-200 whitespace-nowrap self-start md:self-auto">
                Drive Sync Aktif
            </span>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 sm:px-6">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Form Input -->
            <section class="lg:col-span-1">
                <div class="bg-canvas-light shadow-soft-halo rounded-2xl p-6 border border-hairline-light sticky top-6">
                    <h2 id="formTitle" class="text-lg font-semibold mb-5">Tambah Data Wilayah</h2>
                    
                    <form id="dataForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                        <input type="hidden" id="editId">
                        <input type="hidden" id="existingDokumentasi">
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Nama Kabupaten</label>
                            <input type="text" id="kabupaten" required class="w-full border border-hairline-light rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-black">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Nama Desa</label>
                            <input type="text" id="desa" required class="w-full border border-hairline-light rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-black">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Status Bencana</label>
                            <select id="status" required class="w-full border border-hairline-light rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-black bg-white">
                                <option value="" disabled selected>Pilih Status...</option>
                                <option value="Terdampak">Terdampak</option>
                                <option value="Tidak Terdampak">Tidak Terdampak</option>
                            </select>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Dampak Kerusakan</label>
                            <textarea id="dampak" rows="3" placeholder="Deskripsikan kerusakan..." class="w-full border border-hairline-light rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-black"></textarea>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Unggah Dokumentasi (Foto)</label>
                            <input type="file" id="fileUpload" accept="image/*,video/*" class="w-full text-sm text-gray-600 focus:outline-none">
                            <p id="fileHelpText" class="text-xs text-gray-400 mt-2">Pilih file baru untuk menggantikan foto sebelumnya (jika ada).</p>
                        </div>
                        
                        <div class="pt-2 flex gap-2">
                            <button type="submit" id="btnSubmit" class="flex-1 bg-black text-white text-sm font-medium py-2 px-4 rounded-full hover:bg-gray-800 transition-colors flex justify-center items-center gap-2">
                                Simpan Data
                            </button>
                            <button type="button" id="btnCancel" onclick="resetForm()" class="hidden bg-gray-200 text-gray-800 text-sm font-medium py-2 px-4 rounded-full hover:bg-gray-300 transition-colors">
                                Batal
                            </button>
                        </div>
                    </form>
                </div>
            </section>

            <!-- Tabel Data -->
            <section class="lg:col-span-2">
                <div class="bg-canvas-light shadow-soft-halo rounded-2xl p-6 border border-hairline-light">
                    <div class="flex justify-between items-center mb-5">
                        <h2 class="text-lg font-semibold">Tabel Situasi Pasca Bencana</h2>
                        <button onclick="loadData()" class="bg-ocean-10 border border-blue-200 text-blue-900 text-sm font-medium py-2 px-5 rounded-full hover:bg-blue-100 transition-colors flex items-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                            Refresh Data
                        </button>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="border-b border-hairline-light text-sm text-gray-600">
                                    <th class="py-3 px-4 font-medium">Kabupaten</th>
                                    <th class="py-3 px-4 font-medium">Desa</th>
                                    <th class="py-3 px-4 font-medium">Status</th>
                                    <th class="py-3 px-4 font-medium">Kerusakan & File</th>
                                    <th class="py-3 px-4 font-medium text-right">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody" class="text-sm">
                                <tr>
                                    <td colspan="5" class="py-8 text-center text-gray-500">
                                        Memuat data...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>

        </div>
    </main>

    <!-- Komponen Toast Notification -->
    <div id="toast-container" class="fixed bottom-6 right-6 opacity-0 pointer-events-none z-50">
        <div id="toast" class="bg-black text-white px-5 py-3 rounded-full shadow-lg text-sm font-medium flex items-center gap-2">
            <span id="toast-msg">Notifikasi</span>
        </div>
    </div>

    <script>
        // ==========================================
        // KONFIGURASI BACKEND
        // ==========================================
        const APP_CONFIG = {
            API_URL: "https://script.google.com/macros/s/AKfycbwZ6zpq7rpGIjGbfrkmtX9gguftrHKCNkgR5aPq7oSl2V6Utv2wofkfZQ4U6E5_eyP52Q/exec", 
            API_TOKEN: "admin123" 
        };
        // ==========================================

        let appData = [];

        document.addEventListener("DOMContentLoaded", () => {
            if (APP_CONFIG.API_URL && !APP_CONFIG.API_URL.includes("MASUKKAN_URL")) {
                loadData();
            } else {
                document.getElementById('tableBody').innerHTML = `<tr><td colspan="5" class="py-8 text-center text-red-500 font-medium">⚠️ Harap masukkan API_URL Anda di dalam file kode HTML.</td></tr>`;
            }
        });

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = message;
            toast.className = `px-5 py-3 rounded-full shadow-lg text-sm font-medium flex items-center gap-2 ${type === 'error' ? 'bg-red-600 text-white' : 'bg-black text-white'}`;
            container.classList.remove('opacity-0', 'pointer-events-none');
            container.classList.add('opacity-100');
            
            setTimeout(() => {
                container.classList.remove('opacity-100');
                container.classList.add('opacity-0', 'pointer-events-none');
            }, 3000);
        }

        async function fetchGAS(action, payloadData = {}) {
            if (!APP_CONFIG.API_URL || APP_CONFIG.API_URL.includes("MASUKKAN_URL")) {
                showToast("Konfigurasi API URL belum diatur pada script!", "error");
                throw new Error("URL Kosong");
            }

            const payload = {
                role: 'admin',
                token: APP_CONFIG.API_TOKEN,
                action: action,
                ...payloadData
            };

            try {
                const response = await fetch(APP_CONFIG.API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                
                if (result.status === 403 || !result.success) {
                    showToast(result.message || "Akses ditolak atau terjadi kesalahan.", "error");
                    throw new Error(result.message);
                }
                
                return result;
            } catch (error) {
                console.error("API Error:", error);
                throw error;
            }
        }

        async function loadData() {
            try {
                const btn = document.querySelector('button[onclick="loadData()"]');
                if(btn) btn.innerHTML = '<span class="animate-pulse">Memuat...</span>';

                const response = await fetchGAS('read');
                appData = response.data.reverse(); 
                renderTable();
                
            } catch (err) {
            } finally {
                const btn = document.querySelector('button[onclick="loadData()"]');
                if(btn) btn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg> Refresh Data`;
            }
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            if (appData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-gray-500">Belum ada data tersedia.</td></tr>`;
                return;
            }

            appData.forEach(item => {
                const statusTag = item.status === 'Tidak Terdampak' 
                    ? `<span class="bg-aloe-10 text-gray-800 px-2 py-1 rounded-full text-xs font-semibold whitespace-nowrap">${item.status}</span>`
                    : `<span class="bg-gray-200 text-gray-800 px-2 py-1 rounded-full text-xs font-semibold whitespace-nowrap">${item.status}</span>`;

                const dokLink = item.dokumentasi 
                    ? `<a href="${item.dokumentasi}" target="_blank" class="text-blue-600 hover:underline font-medium inline-flex items-center gap-1"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg> Lihat Foto</a>` 
                    : `<span class="text-gray-400 italic">Tidak ada lampiran</span>`;

                const tr = document.createElement('tr');
                tr.className = "border-b border-hairline-light hover:bg-gray-50 transition-colors";
                tr.innerHTML = `
                    <td class="py-3 px-4 font-medium">${item.kabupaten}</td>
                    <td class="py-3 px-4">${item.desa}</td>
                    <td class="py-3 px-4">${statusTag}</td>
                    <td class="py-3 px-4 text-gray-600 truncate max-w-[200px]" title="${item.dampak}">
                        ${item.dampak || '-'}
                        <div class="text-xs mt-1">${dokLink}</div>
                    </td>
                    <td class="py-3 px-4 text-right space-x-2 whitespace-nowrap">
                        <button onclick="editMode('${item.id}')" class="text-xs text-gray-600 hover:text-black font-medium border border-hairline-light rounded-full px-3 py-1">Edit</button>
                        <button onclick="deleteData('${item.id}')" class="text-xs text-red-600 hover:text-red-800 font-medium border border-red-200 rounded-full px-3 py-1 bg-red-50">Hapus</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const action = id ? 'update' : 'create';
            const btnSubmit = document.getElementById('btnSubmit');
            const fileInput = document.getElementById('fileUpload');
            const file = fileInput.files[0];
            
            let fileBase64 = null;
            let fileName = null;
            let mimeType = null;

            try {
                btnSubmit.disabled = true;
                btnSubmit.innerHTML = '<span class="animate-pulse">Mengunggah Data...</span>';

                if (file) {
                    if (file.size > 5 * 1024 * 1024) {
                        throw new Error("Ukuran file maksimal adalah 5MB");
                    }
                    
                    const base64Data = await new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = () => resolve(reader.result.split(',')[1]);
                        reader.onerror = error => reject(error);
                        reader.readAsDataURL(file);
                    });
                    
                    fileBase64 = base64Data;
                    fileName = file.name;
                    mimeType = file.type;
                }

                const payload = {
                    id: id,
                    kabupaten: document.getElementById('kabupaten').value,
                    desa: document.getElementById('desa').value,
                    status: document.getElementById('status').value,
                    dampak: document.getElementById('dampak').value,
                    existingUrl: document.getElementById('existingDokumentasi').value, 
                    fileBase64: fileBase64,
                    fileName: fileName,
                    mimeType: mimeType
                };

                await fetchGAS(action, payload);
                showToast(id ? "Data berhasil diperbarui!" : "Data baru dan file ditambahkan!");
                
                resetForm();
                await loadData();
            } catch (err) {
                showToast(err.message, "error");
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = id ? "Update Data" : "Simpan Data";
            }
        }

        async function deleteData(id) {
            if (!confirm('Apakah Anda yakin ingin menghapus data wilayah ini? (Dokumentasi file di Drive tidak akan ikut terhapus)')) return;
            try {
                await fetchGAS('delete', { id: id });
                showToast("Data berhasil dihapus");
                await loadData();
            } catch (err) {}
        }

        function editMode(id) {
            const item = appData.find(x => x.id === id);
            if (!item) return;

            document.getElementById('formTitle').innerText = "Edit Data Wilayah";
            document.getElementById('editId').value = item.id;
            document.getElementById('kabupaten').value = item.kabupaten;
            document.getElementById('desa').value = item.desa;
            document.getElementById('status').value = item.status;
            document.getElementById('dampak').value = item.dampak;
            document.getElementById('existingDokumentasi').value = item.dokumentasi || "";
            document.getElementById('fileUpload').value = "";
            
            document.getElementById('btnSubmit').innerText = "Update Data";
            document.getElementById('btnCancel').classList.remove('hidden');
            
            document.getElementById('dataForm').scrollIntoView({ behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('dataForm').reset();
            document.getElementById('editId').value = '';
            document.getElementById('existingDokumentasi').value = '';
            document.getElementById('formTitle').innerText = "Tambah Data Wilayah";
            document.getElementById('btnSubmit').innerText = "Simpan Data";
            document.getElementById('btnCancel').classList.add('hidden');
        }
    </script>
</body>
</html>
